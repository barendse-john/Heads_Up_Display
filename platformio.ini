; platformio.ini
; PlatformIO build config for the Heads Up Display.
;
; src_dir = . tells PlatformIO to build the sketch straight out of the
; project root, so the existing flat Arduino layout is kept exactly as-is
; and the folder still opens normally in the Arduino IDE.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Matches Serial.begin(115200) in the sketch
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Drop this to 115200 if uploads fail partway through
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/tzapu/WiFiManager.git
    https://github.com/johnrickman/LiquidCrystal_I2C.git

; Don't try to compile the Google Apps Script file - it isn't C++
build_src_filter =
    +<*>
    -<.git/>
    -<.pio/>
    -<CalendarProxy.gs>
